<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Experiment AI</title>
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#3a659b" />
  <link rel="icon" type="image/png" href="/assets/potion-orb-pfp-sky-bottle.png" />
  <link rel="stylesheet" href="/assets/fonts/fonts.css" />
  <link rel="stylesheet" href="app.css" />
  <link rel="stylesheet" href="settings.css" />
  <link rel="stylesheet" href="rich.css" />
  <link rel="stylesheet" href="home.css" />
  <script>
    // Theme, text size and motion from Settings, before anything draws (app.js keeps them up to date)
    try {
      const p = JSON.parse(localStorage.getItem('ea.prefs')) || {};
      const r = document.documentElement;
      r.dataset.theme = p.theme || 'night';
      r.dataset.text = p.textSize || 'default';
      r.dataset.motion = p.reduceMotion ? 'reduce' : 'full';
    } catch {}
    // On the live site, keep the app hidden until we know who's signed in (auth-app.js), so "Guest" never flashes.
    if (/(^|\.)experimentai\.dev$/.test(location.hostname)) {
      document.documentElement.classList.add('auth-pending');
      setTimeout(() => document.documentElement.classList.remove('auth-pending'), 6000); // never stuck hidden
    }
  </script>
</head>
<body>
  <div class="sky" aria-hidden="true"></div>
  <canvas class="dither-bg" id="dither-bg" aria-hidden="true"></canvas>

  <div class="app" id="app">
    <!-- Floating sidebar -->
    <aside class="sidebar glass" id="sidebar" aria-label="Sidebar">
      <div class="side-top">
        <a class="brand" href="/home">
          <img src="/assets/potion-orb-pfp-sky-bottle.png" alt="" width="30" height="30" />
          <span>Experiment <span class="serif">AI</span></span>
        </a>
        <button type="button" class="icon-btn" id="side-close" aria-label="Hide sidebar" title="Hide sidebar" aria-controls="sidebar">
          <svg class="panel-icon" viewBox="0 0 24 24" aria-hidden="true"><rect width="18" height="18" x="3" y="3" rx="2" /><path d="M9 3v18" /></svg>
        </button>
      </div>

      <div class="side-actions">
        <button type="button" class="side-btn" id="new-chat">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14" /><path d="M12 5v14" /></svg>
          New session
        </button>
        <button type="button" class="side-btn" id="search-btn" aria-controls="search">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="8" /><path d="m21 21-4.3-4.3" /></svg>
          Search
          <kbd class="kbd" id="search-kbd">⌘K</kbd>
        </button>
        <button type="button" class="side-btn" id="projects-btn" aria-controls="projects" aria-expanded="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z" /></svg>
          Projects
        </button>
      </div>

      <div class="side-label-row">
        <p class="side-label">Sessions</p>
        <div class="sort" id="sort">
          <button type="button" class="sort-btn" id="sort-btn" aria-haspopup="menu" aria-expanded="false" aria-controls="sort-menu" title="Sort sessions">
            <span id="sort-label">Recent</span>
            <svg class="ico chev-down" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6" /></svg>
          </button>
          <div class="plus-menu sort-menu" id="sort-menu" role="menu" aria-label="Sort sessions" hidden></div>
        </div>
      </div>
      <ol class="chat-list" id="chat-list"></ol>
      <p class="side-empty" id="chats-empty">No sessions yet</p>

      <!-- Account: picture, name, plan; opens upward -->
      <div class="account">
        <div class="plus-menu account-menu" id="account-menu" role="menu" aria-label="Account" hidden>
          <button type="button" class="menu-item" role="menuitem" data-settings="account">
            <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z" /><circle cx="12" cy="12" r="3" /></svg>
            Settings
          </button>
          <button type="button" class="menu-item" role="menuitem" data-settings="usage">
            <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><line x1="18" x2="18" y1="20" y2="10" /><line x1="12" x2="12" y1="20" y2="4" /><line x1="6" x2="6" y1="20" y2="14" /></svg>
            Usage
          </button>
          <button type="button" class="menu-item" role="menuitem" data-plans>
            <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10" /><path d="m16 12-4-4-4 4" /><path d="M12 16V8" /></svg>
            <span id="upgrade-item-label">Upgrade plan</span>
          </button>
          <div class="menu-sep" role="separator"></div>
          <button type="button" class="menu-item" id="learn-btn" role="menuitem" aria-expanded="false" aria-controls="learn-links">
            <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10" /><path d="M12 16v-4" /><path d="M12 8h.01" /></svg>
            <span class="grow">Learn more</span>
            <svg class="ico chev" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6" /></svg>
          </button>
          <div class="menu-projects" id="learn-links" hidden>
            <a class="menu-item menu-link" role="menuitem" href="https://experimentai.dev/tos" target="_blank" rel="noopener">
              <span class="grow">Terms of Service</span>
              <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 3h6v6" /><path d="M10 14 21 3" /><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6" /></svg>
            </a>
            <a class="menu-item menu-link" role="menuitem" href="https://experimentai.dev/policy" target="_blank" rel="noopener">
              <span class="grow">Privacy Policy</span>
              <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 3h6v6" /><path d="M10 14 21 3" /><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6" /></svg>
            </a>
            <a class="menu-item menu-link" role="menuitem" href="https://experimentai.dev/aboutus" target="_blank" rel="noopener">
              <span class="grow">About us</span>
              <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 3h6v6" /><path d="M10 14 21 3" /><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6" /></svg>
            </a>
          </div>
          <div class="menu-sep" role="separator"></div>
          <button type="button" class="menu-item" role="menuitem" data-signout>
            <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" /><polyline points="16 17 21 12 16 7" /><line x1="21" x2="9" y1="12" y2="12" /></svg>
            Log out
          </button>
        </div>

        <button type="button" class="account-btn" id="account-btn" aria-haspopup="menu" aria-expanded="false" aria-controls="account-menu">
          <img class="avatar" id="account-pfp" src="/assets/potion-orb-icon-pfp.png" alt="" width="34" height="34" referrerpolicy="no-referrer" />
          <span class="account-text">
            <span class="account-name" id="account-name">Guest</span>
            <span class="account-plan" id="account-plan">Free plan</span>
          </span>
          <svg class="ico chev-down" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6" /></svg>
        </button>
      </div>
    </aside>

    <button type="button" class="icon-btn side-open glass" id="side-open" aria-label="Show sidebar" title="Show sidebar" aria-controls="sidebar">
      <svg class="panel-icon" viewBox="0 0 24 24" aria-hidden="true"><rect width="18" height="18" x="3" y="3" rx="2" /><path d="M9 3v18" /></svg>
    </button>
    <div class="scrim" id="scrim" aria-hidden="true"></div>

    <!-- Chat area -->
    <main class="main">
      <div class="thread" id="thread">
        <div class="greeting" id="greeting">
          <div class="greeting-row">
            <img class="greeting-logo" src="/assets/potion-orb-pfp-sky-bottle.png" alt="" width="64" height="64" />
            <h1 id="greeting-text">Experiment <span class="serif">AI</span></h1>
          </div>
        </div>
        <ol class="messages" id="messages" aria-live="polite"></ol>
      </div>

      <!-- Floating message bar -->
      <form class="composer glass" id="composer" autocomplete="off">
        <div class="chips" id="chips"></div>
        <div class="composer-row">
          <label class="visually-hidden" for="input">Message</label>
          <textarea id="input" rows="1" placeholder="Message Experiment AI" enterkeyhint="send"></textarea>
          <button type="button" class="plus" id="plus" aria-label="Add files, projects and more" title="Add files, projects and more" aria-haspopup="menu" aria-expanded="false" aria-controls="plus-menu">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14" /><path d="M12 5v14" /></svg>
          </button>
          <!-- model + effort: in the message bar, before the mic -->
          <button type="button" class="model-btn" id="model-btn" aria-haspopup="menu" aria-expanded="false" aria-controls="model-menu" title="Model and effort">
            <img class="model-logo" id="model-logo" src="/assets/ai/claude-color.svg" alt="" width="16" height="16" />
            <span class="model-name" id="model-name">Sonnet 5.5</span>
            <span class="model-effort" id="model-effort">Medium</span>
            <svg class="ico chev-down" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6" /></svg>
          </button>
          <button type="button" class="mic" id="mic" aria-label="Dictate" title="Dictate">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z" /><path d="M19 10v2a7 7 0 0 1-14 0v-2" /><line x1="12" x2="12" y1="19" y2="22" /></svg>
          </button>
          <button type="submit" class="send" id="send" aria-label="Send" title="Send" disabled>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 7-7 7 7" /><path d="M12 19V5" /></svg>
          </button>
        </div>


        <!-- usage: plain text under the bar, on the right; opens Settings › Usage -->
        <button type="button" class="usage-btn" id="usage-btn" title="Usage">
          <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><line x1="18" x2="18" y1="20" y2="10" /><line x1="12" x2="12" y1="20" y2="4" /><line x1="6" x2="6" y1="20" y2="14" /></svg>
          <span id="usage-label">Usage</span>
        </button>

        <div class="plus-menu" id="plus-menu" role="menu" aria-label="Add" hidden>
          <button type="button" class="menu-item" id="menu-files" role="menuitem">
            <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z" /><path d="M14 2v4a2 2 0 0 0 2 2h4" /></svg>
            Upload files
          </button>
          <button type="button" class="menu-item" id="menu-folder" role="menuitem">
            <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z" /><path d="M12 10v6" /><path d="m9 13 3-3 3 3" /></svg>
            Upload a folder
          </button>
          <div class="menu-sep" role="separator"></div>
          <button type="button" class="menu-item" id="menu-project-btn" role="menuitem" aria-expanded="false" aria-controls="menu-projects">
            <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 10v6" /><path d="M9 13h6" /><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z" /></svg>
            <span class="grow">Add to project</span>
            <svg class="ico chev" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6" /></svg>
          </button>
          <div class="menu-projects" id="menu-projects" hidden></div>
          <button type="button" class="menu-item" id="menu-tools-btn" role="menuitem" aria-expanded="false" aria-controls="menu-tools">
            <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 22v-5" /><path d="M9 8V2" /><path d="M15 8V2" /><path d="M18 8v5a4 4 0 0 1-4 4h-4a4 4 0 0 1-4-4V8Z" /></svg>
            <span class="grow">Connectors</span>
            <span class="menu-count" id="menu-tools-count" hidden></span>
            <svg class="ico chev" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6" /></svg>
          </button>
          <div class="menu-projects menu-tools" id="menu-tools" hidden></div>
        </div>

        <div class="plus-menu model-menu" id="model-menu" role="menu" aria-label="Model and effort" hidden>
          <!-- either the 5 brands, or one brand's models: chat, then image, then video -->
          <div class="model-view" id="model-view"></div>
          <div class="effort" id="effort-box">
            <div class="effort-head">
              <strong>Effort</strong>
              <small id="effort-note">How hard it thinks before answering</small>
            </div>
            <div class="effort-seg" id="effort-seg" role="radiogroup" aria-label="Effort"></div>
          </div>
        </div>

        <input type="file" id="file-input" multiple hidden />
        <input type="file" id="folder-input" webkitdirectory multiple hidden />
      </form>
    </main>

    <!-- Projects panel (right) -->
    <aside class="projects glass" id="projects" aria-label="Projects">
      <div class="panel-top">
        <h2>Projects</h2>
        <button type="button" class="icon-btn" id="projects-close" aria-label="Close projects" title="Close">
          <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18" /><path d="m6 6 12 12" /></svg>
        </button>
      </div>
      <div class="panel-body" id="projects-body"></div>
    </aside>
  </div>

  <!-- Search -->
  <div class="search-layer" id="search" hidden>
    <div class="search-box" role="dialog" aria-modal="true" aria-label="Search sessions">
      <div class="search-field">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="8" /><path d="m21 21-4.3-4.3" /></svg>
        <input type="search" id="search-input" placeholder="Search all your sessions" aria-controls="search-results" />
        <kbd class="kbd">Esc</kbd>
      </div>
      <ol class="search-results" id="search-results"></ol>
    </div>
  </div>

  <!-- Settings: Account, Billing, Usage, Personalization, Connectors (settings.js) -->
  <div class="settings-layer" id="settings" hidden>
    <div class="settings" role="dialog" aria-modal="true" aria-labelledby="settings-title">
      <nav class="settings-nav">
        <h2 id="settings-title">Settings</h2>
        <div class="settings-tabs" id="settings-tabs" role="tablist" aria-orientation="vertical"></div>
      </nav>
      <section class="settings-body" id="settings-body" role="tabpanel"></section>
      <button type="button" class="icon-btn settings-close" id="settings-close" aria-label="Close settings" title="Close">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18" /><path d="m6 6 12 12" /></svg>
      </button>
    </div>
  </div>

  <!-- Plans: the 4 paid plans as cards, and Stripe checkout (settings.js) -->
  <div class="plans-layer" id="plans" hidden>
    <div class="plans-box" role="dialog" aria-modal="true" aria-labelledby="plans-title">
      <div class="plans-head">
        <h2 id="plans-title">Upgrade your plan</h2>
        <button type="button" class="icon-btn" id="plans-close" aria-label="Close" title="Close">
          <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18" /><path d="m6 6 12 12" /></svg>
        </button>
      </div>
      <div class="plans-body" id="plans-body"></div>
    </div>
  </div>

  <div class="notice" id="notice" role="status" aria-live="polite"></div>

  <script src="rich.js"></script>
  <script src="app.js"></script>
  <script src="settings.js"></script>
  <script src="home.js"></script>
  <script src="dither.js"></script>
  <script type="module" src="auth-app.js"></script>
</body>
</html>
