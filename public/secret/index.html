<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Experiment AI</title>
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#3a659b" />
  <link rel="icon" type="image/png" href="/assets/potion-orb-pfp-sky-bottle.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&family=Instrument+Serif:ital@0;1&display=swap" />
  <link rel="stylesheet" href="app.css" />
</head>
<body>
  <div class="sky" aria-hidden="true"></div>

  <div class="app" id="app">
    <!-- Floating sidebar -->
    <aside class="sidebar glass" id="sidebar" aria-label="Sidebar">
      <div class="side-top">
        <a class="brand" href="/">
          <img src="/assets/potion-orb-pfp-sky-bottle.png" alt="" width="30" height="30" />
          <span>Experiment AI</span>
        </a>
        <button type="button" class="icon-btn" id="side-close" aria-label="Hide sidebar" title="Hide sidebar" aria-controls="sidebar">
          <svg class="panel-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="4.5" width="17" height="15" rx="3" /><path d="M9.5 4.5v15" /></svg>
        </button>
      </div>

      <button type="button" class="side-btn" id="new-chat">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" /></svg>
        New chat
      </button>

      <p class="side-label">Chats</p>
      <p class="side-empty">No chats yet</p>
    </aside>

    <button type="button" class="icon-btn side-open glass" id="side-open" aria-label="Show sidebar" title="Show sidebar" aria-controls="sidebar">
      <svg class="panel-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="4.5" width="17" height="15" rx="3" /><path d="M9.5 4.5v15" /></svg>
    </button>
    <div class="scrim" id="scrim" aria-hidden="true"></div>

    <!-- Chat area -->
    <main class="main">
      <div class="thread" id="thread">
        <div class="greeting" id="greeting">
          <div class="greeting-row">
            <h1 id="greeting-text">What are we <span class="serif">trying</span> today?</h1>
            <img class="greeting-logo" src="/assets/potion-orb-pfp-sky-bottle.png" alt="" width="64" height="64" />
          </div>
        </div>
        <ol class="messages" id="messages" aria-live="polite"></ol>
      </div>

      <!-- Floating message bar -->
      <form class="composer glass" id="composer" autocomplete="off">
        <label class="visually-hidden" for="input">Message</label>
        <textarea id="input" rows="1" placeholder="Message Experiment AI" enterkeyhint="send"></textarea>
        <button type="submit" class="send" id="send" aria-label="Send" title="Send" disabled>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M5.5 11.5 12 5l6.5 6.5" /></svg>
        </button>
      </form>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
