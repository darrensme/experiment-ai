  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#3a659b" />

  <link rel="stylesheet" href="settings.css" />
  <link rel="stylesheet" href="rich.css" />
  <link rel="stylesheet" href="home.css" />
  <script>
    // Theme, text size and motion from Settings, before anything draws (app.js keeps them up to date)
    try {
      const p = JSON.parse(localStorage.getItem('ea.prefs')) || {};
      const r = document.documentElement;
      r.dataset.theme = p.theme || 'night';
      r.dataset.text = p.textSize || 'default';
      r.dataset.motion = p.reduceMotion ? 'reduce' : 'full';
    } catch {}
    // On the live site, keep the app hidden until we know who's signed in (auth-app.js), so "Guest" never flashes.
    if (/(^|\.)experimentai\.dev$/.test(location.hostname)) {
      document.documentElement.classList.add('auth-pending');
      setTimeout(() => document.documentElement.classList.remove('auth-pending'), 6000); // never stuck hidden
    }
  </script>
</head>

          <div class="menu-projects" id="menu-projects" hidden></div>
          <button type="button" class="menu-item" id="menu-tools-btn" role="menuitem" aria-expanded="false" aria-controls="menu-tools">
            <svg class="ico" viewBox="0 0 256 256" aria-hidden="true"><path d="M237.66,66.34a8,8,0,0,0-11.32,0L192,100.69,155.31,64l34.35-34.34a8,8,0,1,0-11.32-11.32L144,52.69,117.66,26.34a8,8,0,0,0-11.32,11.32L112.69,44l-53,53a40,40,0,0,0,0,56.57l15.71,15.71L26.34,218.34a8,8,0,0,0,11.32,11.32l49.09-49.09,15.71,15.71a40,40,0,0,0,56.57,0l53-53,6.34,6.35a8,8,0,0,0,11.32-11.32L203.31,112l34.35-34.34A8,8,0,0,0,237.66,66.34ZM147.72,185a24,24,0,0,1-33.95,0L71,142.23a24,24,0,0,1,0-33.95l53-53L200.69,132Z"/></svg>
            <span class="grow">Connectors</span>
            <span class="menu-count" id="menu-tools-count" hidden></span>
            <svg class="ico chev" viewBox="0 0 256 256" aria-hidden="true"><path d="M181.66,133.66l-80,80a8,8,0,0,1-11.32-11.32L164.69,128,90.34,53.66a8,8,0,0,1,11.32-11.32l80,80A8,8,0,0,1,181.66,133.66Z"/></svg>
          </button>
          <div class="menu-projects menu-tools" id="menu-tools" hidden></div>
        </div>

        <div class="plus-menu model-menu" id="model-menu" role="menu" aria-label="Model and effort" hidden>
          <!-- either the 5 brands, or one brand's models: chat, then image, then video -->
          <div class="model-view" id="model-view"></div>
          <div class="effort" id="effort-box">
            <div class="effort-head">
              <strong>Effort</strong>
              <small id="effort-note">How hard it thinks before answering</small>
            </div>
            <div class="effort-seg" id="effort-seg" role="radiogroup" aria-label="Effort"></div>
          </div>
        </div>

        <input type="file" id="file-input" multiple hidden />
        <input type="file" id="folder-input" webkitdirectory multiple hidden />
      </form>
    </main>

    <!-- Projects panel (right) -->
    <aside class="projects glass" id="projects" aria-label="Projects">
      <div class="panel-top">
        <h2>Projects</h2>
        <button type="button" class="icon-btn" id="projects-close" aria-label="Close projects" title="Close">
          <svg class="ico" viewBox="0 0 256 256" aria-hidden="true"><path d="M205.66,194.34a8,8,0,0,1-11.32,11.32L128,139.31,61.66,205.66a8,8,0,0,1-11.32-11.32L116.69,128,50.34,61.66A8,8,0,0,1,61.66,50.34L128,116.69l66.34-66.35a8,8,0,0,1,11.32,11.32L139.31,128Z"/></svg>
        </button>
      </div>
      <div class="panel-body" id="projects-body"></div>
    </aside>
  </div>

  <!-- Search -->
  <div class="search-layer" id="search" hidden>
    <div class="search-box" role="dialog" aria-modal="true" aria-label="Search sessions">
      <div class="search-field">
        <svg class="ico" viewBox="0 0 256 256" aria-hidden="true"><path d="M229.66,218.34l-50.07-50.06a88.11,88.11,0,1,0-11.31,11.31l50.06,50.07a8,8,0,0,0,11.32-11.32ZM40,112a72,72,0,1,1,72,72A72.08,72.08,0,0,1,40,112Z"/></svg>
        <input type="search" id="search-input" placeholder="Search all your sessions" aria-controls="search-results" />
        <kbd class="kbd">Esc</kbd>
      </div>
      <ol class="search-results" id="search-results"></ol>
    </div>
  </div>

  <!-- Settings: Account, Billing, Usage, Personalization, Connectors (settings.js) -->
  <div class="settings-layer" id="settings" hidden>
    <div class="settings" role="dialog" aria-modal="true" aria-labelledby="settings-title">
      <nav class="settings-nav">
        <h2 id="settings-title">Settings</h2>
        <div class="settings-tabs" id="settings-tabs" role="tablist" aria-orientation="vertical"></div>
      </nav>
      <section class="settings-body" id="settings-body" role="tabpanel"></section>
      <button type="button" class="icon-btn settings-close" id="settings-close" aria-label="Close settings" title="Close">
        <svg class="ico" viewBox="0 0 256 256" aria-hidden="true"><path d="M205.66,194.34a8,8,0,0,1-11.32,11.32L128,139.31,61.66,205.66a8,8,0,0,1-11.32-11.32L116.69,128,50.34,61.66A8,8,0,0,1,61.66,50.34L128,116.69l66.34-66.35a8,8,0,0,1,11.32,11.32L139.31,128Z"/></svg>
      </button>
    </div>
  </div>

  <!-- Plans: the 4 paid plans as cards, and Stripe checkout (settings.js) -->
  <div class="plans-layer" id="plans" hidden>
    <div class="plans-box" role="dialog" aria-modal="true" aria-labelledby="plans-title">
      <div class="plans-head">
        <h2 id="plans-title">Upgrade your plan</h2>
        <button type="button" class="icon-btn" id="plans-close" aria-label="Close" title="Close">
          <svg class="ico" viewBox="0 0 256 256" aria-hidden="true"><path d="M205.66,194.34a8,8,0,0,1-11.32,11.32L128,139.31,61.66,205.66a8,8,0,0,1-11.32-11.32L116.69,128,50.34,61.66A8,8,0,0,1,61.66,50.34L128,116.69l66.34-66.35a8,8,0,0,1,11.32,11.32L139.31,128Z"/></svg>
        </button>
      </div>
      <div class="plans-body" id="plans-body"></div>
    </div>
  </div>

  <div class="notice" id="notice" role="status" aria-live="polite"></div>

  <script src="rich.js"></script>
  <script src="app.js"></script>
  <script src="settings.js"></script>
  <script src="home.js"></script>
  <script src="dither.js"></script>
  <script type="module" src="auth-app.js"></script>
</body>
</html>
