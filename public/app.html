<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Experiment AI</title>
  <meta name="theme-color" content="#3a659b" />
  <link rel="icon" type="image/png" href="assets/potion-orb-pfp-sky-bottle.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&family=Instrument+Serif:ital@0;1&display=swap" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="app.css" />
</head>
<body class="app-body">
  <div class="sky" aria-hidden="true">
    <div class="blob b1"></div>
    <div class="blob b2"></div>
    <div class="blob b3"></div>
    <div class="blob b4"></div>
    <div class="blob b5"></div>
  </div>
  <div class="grain" aria-hidden="true"></div>

  <header class="app-top">
    <a class="round-btn" href="/" aria-label="Back to the Experiment AI homepage">
      <img src="assets/potion-orb-pfp-sky-bottle.png" alt="" />
    </a>
    <div class="app-title">Experiment <em class="serif gold">AI</em></div>
    <div class="account">
      <button class="avatar" aria-haspopup="menu" aria-expanded="false" aria-label="Account menu"></button>
      <div class="menu glass" role="menu" hidden>
        <p class="menu-name"></p>
        <p class="menu-email"></p>
        <button role="menuitem" data-action="clear">Clear chat</button>
        <button role="menuitem" data-action="logout">Log out</button>
      </div>
    </div>
  </header>

  <aside class="clock" aria-hidden="true">
    <span class="clock-day"></span>
    <span class="clock-date"></span>
    <span class="clock-time"></span>
  </aside>

  <main class="chat">
    <div class="thread" aria-live="polite">
      <div class="welcome">
        <img src="assets/potion-orb-pfp-sky-bottle.png" alt="" class="welcome-logo" />
        <h1 class="greeting">Hello.</h1>
        <p>All five models, one chat. Pick one below or let <strong>Auto</strong> choose.</p>
      </div>
    </div>

    <form class="composer" autocomplete="off">
      <div class="models" role="radiogroup" aria-label="Model">
        <button type="button" role="radio" data-model="auto" aria-checked="true"><img src="assets/potion-orb-pfp-sky-bottle.png" alt="" />Auto</button>
        <button type="button" role="radio" data-model="grok" aria-checked="false"><img src="assets/ai/grok.svg" alt="" />Grok</button>
        <button type="button" role="radio" data-model="claude" aria-checked="false"><img src="assets/ai/claude-color.svg" alt="" />Claude</button>
        <button type="button" role="radio" data-model="gemini" aria-checked="false"><img src="assets/ai/gemini-color.svg" alt="" />Gemini</button>
        <button type="button" role="radio" data-model="chatgpt" aria-checked="false"><img src="assets/ai/openai.svg" alt="" />ChatGPT</button>
        <button type="button" role="radio" data-model="muse" aria-checked="false"><img src="assets/ai/meta-color.svg" alt="" />Meta Muse</button>
      </div>
      <div class="input-row">
        <textarea name="content" rows="1" placeholder="Message Experiment AI" aria-label="Message" maxlength="4000"></textarea>
        <button class="send" type="submit" aria-label="Send">↑</button>
      </div>
    </form>
  </main>

  <script src="app.js"></script>
</body>
</html>
